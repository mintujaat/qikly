<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist — Qikly</title><link rel="stylesheet" href="/style.css"></head><body><div data-shell-header></div><main class="page-wrap"><div class="container"><span class="eyebrow">SAVED FOR LATER</span><h1 class="page-title">Wishlist</h1><p class="page-sub">Keep the products you love one tap away.</p><div id="grid" class="wishlist-grid"></div></div></main><div data-shell-footer></div><div class="toast" id="toast"></div><script src="/store.js"></script><script>const S=QiklyStore;S.loadPublic().then(d=>{const ps=S.read(S.KEYS.wishlist,[]).map(id=>d.products.find(p=>p.id===id)).filter(Boolean);document.querySelector('#grid').innerHTML=ps.length?ps.map(S.productCard).join(''):'<div class="empty-state" style="grid-column:1/-1"><h3>Your wishlist is empty</h3><p>Tap the heart on any product to save it.</p><a class="btn btn-gold" href="/#shop">Browse products</a></div>'}).catch(e=>S.toast(e.message));</script></body></html>
