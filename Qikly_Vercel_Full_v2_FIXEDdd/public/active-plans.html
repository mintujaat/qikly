<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Active Plans — Qikly Invest</title><link rel="stylesheet" href="/style.css"><script src="/theme.js"></script></head><body class="page-with-dock">
<header class="site-header"><a href="/" class="brand"><span class="brand-dot">Q</span><span>Qikly Invest</span></a><nav class="main-nav"><a href="/">Home</a><a href="/active-plans.html">Active Plans</a><a href="/transactions.html">Transactions</a><a href="/withdrawal.html">Withdrawal</a></nav><div class="header-actions"><span id="balancePill" class="balance-pill">₹0</span><button class="btn theme-toggle" data-theme-toggle>☾</button><a href="/profile.html" class="btn primary">My Account</a></div></header>
<main class="wrap dashboard-page"><div class="page-title"><div><span class="eyebrow">PORTFOLIO</span><h1>Active plans</h1><p>Track every active plan, daily credit and progress from one place.</p></div><a href="/#plans" class="btn primary">Browse Plans</a></div><section id="activeSummary" class="dashboard-grid"></section><section class="section"><div id="activeList" class="investment-list"></div></section></main>
<nav class="floating-dock" data-float-nav aria-label="Quick navigation"><a class="float-nav-item" data-nav href="/"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-7h5v7"/></svg><span>Home</span></a><a class="float-nav-item" data-nav href="/active-plans.html"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h6M8 17h4"/></svg><span>Active</span></a><a class="float-nav-item" data-nav href="/transactions.html"><svg viewBox="0 0 24 24"><path d="M7 7h10M7 12h7M7 17h10"/><path d="m17 9 2 2-2 2"/></svg><span>Transactions</span></a><a class="float-nav-item" data-nav href="/withdrawal.html"><svg viewBox="0 0 24 24"><path d="M12 3v13"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg><span>Withdraw</span></a><a class="float-nav-item" data-nav href="/profile.html"><span class="float-nav-avatar" data-dock-avatar>Q</span><span>My Account</span></a></nav><script src="/nav.js"></script><script>
const $=s=>document.querySelector(s),money=n=>`₹${Number(n||0).toLocaleString('en-IN')}`;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const date=v=>{if(!v)return'—';const d=typeof v?.toDate==='function'?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})};
async function api(u,o={}){const r=await fetch(u,{cache:'no-store',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}
function render(investments,transactions){const active=(investments||[]).filter(x=>x.status==='active');const activeIds=new Set(active.map(x=>x.id));const totalInterest=(transactions||[]).filter(x=>x.type==='return'&&x.status==='completed'&&activeIds.has(x.referenceId)).reduce((sum,x)=>sum+Number(x.amount||0),0);$('#activeSummary').innerHTML=`<article class="card balance-card"><span class="eyebrow">ACTIVE PLANS</span><strong>${active.length}</strong><p>Plans currently running on your account.</p></article><article class="card balance-card"><span class="eyebrow">TOTAL INVESTED</span><strong>${money(active.reduce((s,x)=>s+Number(x.amount||0),0))}</strong><p>Principal currently allocated to active plans.</p></article><article class="card balance-card"><span class="eyebrow">INTEREST EARNED</span><strong class="positive">${money(totalInterest)}</strong><p>Daily plan earnings already credited to your wallet.</p></article>`;$('#activeList').innerHTML=active.length?active.map(x=>{const days=Number(x.days||0),credited=Math.min(days,Number(x.creditedDays||0)),progress=Math.min(100,credited/Math.max(days,1)*100),earned=(transactions||[]).filter(t=>t.type==='return'&&t.status==='completed'&&t.referenceId===x.id).reduce((sum,t)=>sum+Number(t.amount||0),0),remaining=Math.max(0,days-credited);return `<article class="card investment-row"><div class="plan-top"><div><span class="tag">ACTIVE</span><h3>${esc(x.planTitle)}</h3><p>Started ${date(x.startAt)} · Ends ${date(x.endAt)}</p></div><strong class="positive">${money(x.dailyIncrease)}/day</strong></div><div class="investment-numbers"><div><span>Your investment</span><strong>${money(x.amount)}</strong></div><div><span>Daily earning</span><strong>${money(x.dailyIncrease)}</strong></div><div><span>Interest received</span><strong class="positive">${money(earned)}</strong></div><div><span>Days left</span><strong>${remaining}</strong></div></div><div class="progress"><i style="width:${progress}%"></i></div><div class="plan-total"><b>${credited}/${days} days completed</b> · Expected total interest: <b>${money(Number(x.dailyIncrease||0)*days)}</b></div><div class="notice">Your investment (principal) and interest earned are shown separately. Only credited plan earnings become withdrawable.</div></article>`}).join(''):`<div class="empty card"><h3 style="margin:0 0 7px">No active plan yet</h3><p>Choose a plan from the home page and activate it using your available balance.</p><a class="btn primary" href="/#plans">Browse plans →</a></div>`}
(async()=>{try{const me=await api('/api/auth/me');if(!me.authenticated)return location.href='/auth.html?next=/active-plans.html';$('#balancePill').textContent=money(me.balance);const d=await api('/api/user/dashboard');render(d.investments,d.transactions)}catch(e){if(e.message.includes('Login required'))location.href='/auth.html?next=/active-plans.html';else $('#activeList').innerHTML=`<div class="empty error-state">${esc(e.message)}</div>`}})();</script></body></html>
