<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders — Qikly</title><link rel="stylesheet" href="/style.css"><script src="/theme.js"></script></head><body class="page-with-dock"><header class="site-header"><a href="/" class="brand"><span class="brand-dot">Q</span><span>Qikly</span></a><nav class="main-nav"><a href="/#shop">Shop</a><a href="/#deals">Deals</a><a href="/transactions.html">Transactions</a><a href="/profile.html">Wallet</a></nav><div class="header-actions"><span id="balancePill" class="balance-pill">₹0</span><button class="btn theme-toggle" data-theme-toggle>☾</button><a href="/profile.html" class="btn primary">My Account</a></div></header><main class="wrap dashboard-page"><div class="page-title"><div><span class="eyebrow">QIKLY SHOPPING</span><h1>My Orders</h1><p>Purchases made through your existing Qikly wallet are shown here.</p></div><a href="/#shop" class="btn primary">Continue shopping</a></div><section class="dashboard-grid" id="activeSummary"></section><section class="section"><div id="activeList" class="investment-list"></div></section></main><nav class="floating-dock" data-float-nav aria-label="Quick navigation"><a class="float-nav-item" data-nav href="/"><span>⌂</span><span>Shop</span></a><a class="float-nav-item" data-nav href="/#deals"><span>🔥</span><span>Deals</span></a><a class="float-nav-item active" data-nav href="/active-plans.html"><span>🛍</span><span>Orders</span></a><a class="float-nav-item" data-nav href="/transactions.html"><span>↕</span><span>Transactions</span></a><a class="float-nav-item" data-nav href="/profile.html"><span>Q</span><span>Account</span></a></nav><script src="/nav.js"></script><script>
const $=s=>document.querySelector(s),money=n=>`₹${Number(n||0).toLocaleString('en-IN')}`,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const date=v=>{if(!v)return'—';const d=typeof v?.toDate==='function'?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})};async function api(u,o={}){const r=await fetch(u,{cache:'no-store',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}function render(items,tx){const active=(items||[]).filter(x=>x.status==='active');$('#activeSummary').innerHTML=`<article class="card balance-card"><span class="eyebrow">ACTIVE</span><strong>${active.length}</strong><p>Purchased items currently active.</p></article><article class="card balance-card"><span class="eyebrow">WALLET</span><strong>${money(tx.filter(x=>x.type==='investment').reduce((s,x)=>s+Math.abs(Number(x.amount||0)),0))}</strong><p>Total amount recorded against purchases in the available history.</p></article>`;$('#activeList').innerHTML=active.length?active.map(x=>`<article class="card investment-row"><div class="plan-top"><div><span class="tag">PURCHASED</span><h3>${esc(x.planTitle)}</h3><p>Purchased ${date(x.startAt)}</p></div><strong>${money(x.amount)}</strong></div><div class="investment-numbers"><div><span>Amount</span><strong>${money(x.amount)}</strong></div><div><span>Status</span><strong>Active</strong></div><div><span>Start</span><strong>${date(x.startAt)}</strong></div><div><span>Ends</span><strong>${date(x.endAt)}</strong></div></div><div class="progress"><i style="width:${Math.min(100,Number(x.creditedDays||0)/Math.max(1,Number(x.days||1))*100)}%"></i></div></article>`).join(''):`<div class="empty card"><h3>No purchases yet</h3><p>Choose a product from the Diwali sale to get started.</p><a href="/#shop" class="btn primary">Browse products</a></div>`}
(async()=>{try{const me=await api('/api/auth/me');if(!me.authenticated)return location.href='/auth.html?next=/active-plans.html';$('#balancePill').textContent=money(me.balance);const d=await api('/api/user/dashboard');render(d.investments||[],d.transactions||[])}catch(e){$('#activeList').innerHTML=`<div class="empty error-state">${esc(e.message)}</div>`}})();</script></body></html>
