<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat — AstroSage AI</title><link rel="stylesheet" href="/style.css"></head>
<body class="chat-page">
<header class="chat-top">
 <a href="/" class="back-chat">←</a>
 <div id="topGuru" class="chat-guru-head"><div class="tiny-avatar">🔮</div><div><strong>गुरु</strong><small>AI मार्गदर्शक</small></div></div>
 <div class="timer-wrap"><span>SESSION</span><div class="chat-timer" id="timer">00:30</div></div>
</header>
<main class="chat-main">
 <div id="chatMessages" class="chat-messages"></div>
 <section id="plansBox" class="plans-box chat-plans-inline hidden" aria-label="चैट प्लान">
   <div class="plans-inline-head">
    <div>
      <span class="small-gold">आगे की बातचीत</span>
      <h2>थोड़ा और समय चाहिए?</h2>
      <p>अपनी जरूरत के हिसाब से चैट का समय चुनें।</p>
    </div>
    <span class="plan-lotus">🪷</span>
   </div>
   <div id="chatPlans" class="chat-plans-list"></div>
  </section>
</main>
<div id="typing" class="typing-indicator hidden"><span></span><span></span><span></span><em>गुरु लिख रहे हैं…</em></div>
<form id="chatForm" class="chat-input"><input id="message" maxlength="1200" placeholder="अपनी बात लिखें…" autocomplete="off"><button id="sendBtn" type="submit">➤</button></form>
<div id="nameModal" class="name-modal hidden"><div class="name-card"><div class="small-gold">शुरू करने से पहले</div><h2>गुरु आपको किस नाम से बुलाएँ?</h2><p>नाम सिर्फ बातचीत को थोड़ा personal बनाने के लिए है।</p><input id="customerName" maxlength="80" placeholder="आपका नाम"><button id="startBtn">बात शुरू करें →</button></div></div>
<div id="toast" class="toast"></div>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="/chat.js"></script></body></html>
