<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat — AstroSage AI</title><link rel="stylesheet" href="/style.css"></head>
<body class="chat-page"><header class="chat-top"><a href="/" class="back-chat">←</a><div id="topGuru"><div class="tiny-avatar">🔮</div><div><strong>Guru</strong><small>AI Guide</small></div></div><div class="chat-timer" id="timer">00:30</div></header>
<main class="chat-main"><div id="chatMessages" class="chat-messages"></div><div id="plansBox" class="plans-box hidden"><div class="paywall-title">Your session has ended</div><p>Choose how much time you want to continue.</p><div id="chatPlans"></div></div></main>
<form id="chatForm" class="chat-input"><input id="message" maxlength="2000" placeholder="Type your message…" autocomplete="off"><button id="sendBtn" type="submit">➤</button></form>
<div id="nameModal" class="name-modal hidden"><div class="name-card"><div class="small-gold">BEFORE WE BEGIN</div><h2>What should your Guru call you?</h2><p>Your name is only used to personalize this chat.</p><input id="customerName" maxlength="80" placeholder="Your name"><button id="startBtn">Start chat →</button></div></div>
<div id="toast" class="toast"></div><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="/chat.js"></script></body></html>
