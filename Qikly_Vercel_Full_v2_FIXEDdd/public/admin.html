<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qikly Admin</title><link rel="stylesheet" href="style.css"><style>body{min-height:100vh}.admin-wrap{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:25px 18px;background:#0b0b0f}.side-logo{font-size:24px;font-weight:800;margin:0 10px 30px}.side-logo span{color:var(--accent)}.side-btn{display:block;width:100%;text-align:left;padding:12px 13px;margin:4px 0;background:transparent;border:0;color:#9993a1;border-radius:10px;cursor:pointer}.side-btn.active,.side-btn:hover{background:#18151e;color:#fff}.admin-main{padding:35px;max-width:1400px;width:100%}.top{margin-bottom:30px}.top h1{font-size:36px;letter-spacing:-2px;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{border:1px solid var(--line);background:#0d0d11;padding:20px;border-radius:16px}.stat small{color:#88818f}.stat strong{display:block;font-size:28px;margin-top:8px}.panel{margin-top:20px;border:1px solid var(--line);background:#0d0d11;border-radius:16px;padding:22px;overflow:auto}.login{max-width:400px;margin:14vh auto;padding:32px;border:1px solid var(--line);border-radius:20px;background:#0d0d11}.login h1{font-size:36px}.admin-content section{display:none}.admin-content section.active{display:block}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.admin-card{max-width:700px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:#85808c}.pill{padding:4px 8px;border-radius:99px;background:#49d68a14;color:#49d68a;border:1px solid #49d68a33}.edit-btn{border:1px solid var(--line);background:#17141d;color:#fff;padding:7px 11px;border-radius:8px;cursor:pointer}.edit-btn:hover{border-color:var(--accent);background:#201a2b}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.modal.hidden{display:none}.modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:#0e0d12;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 20px 80px rgba(0,0,0,.45)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0}.modal-close{border:0;background:transparent;color:#aaa;font-size:28px;cursor:pointer}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.modal textarea{min-height:120px;resize:vertical}.modal select,.modal input,.modal textarea{width:100%;box-sizing:border-box}@media(max-width:850px){.admin-wrap{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.stats{grid-template-columns:1fr 1fr}.admin-main{padding:20px}.form-grid{grid-template-columns:1fr}}</style></head><body>
<div id="loginView" class="login"><div class="eyebrow"><span></span> QIKLY ADMIN</div><h1>Admin access.</h1><p class="muted">Enter the admin password.</p><form id="loginForm"><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary full">Login</button><div id="loginError" class="error"></div></form></div>
<div id="adminView" class="admin-wrap hidden"><aside class="sidebar"><div class="side-logo">Qikly<span>.</span></div><button class="side-btn active" data-section="dashboard">Dashboard</button><button class="side-btn" data-section="plans">Plans</button><button class="side-btn" data-section="orders">Orders</button><button class="side-btn" data-section="subscriptions">Subscriptions</button><button class="side-btn" data-section="reviews">Reviews</button><button class="side-btn" data-section="faqAdmin">FAQ</button><button class="side-btn" data-section="settings">Telegram / Settings</button><button id="logout" class="side-btn">Logout</button></aside><main class="admin-main"><div class="top"><div><div class="eyebrow"><span></span> CONTROL PANEL</div><h1 id="pageTitle">Dashboard</h1></div></div><div class="admin-content">
<section id="dashboard" class="active"><div class="stats"><div class="stat"><small>Plans</small><strong id="statPlans">0</strong></div><div class="stat"><small>Orders</small><strong id="statOrders">0</strong></div><div class="stat"><small>Paid</small><strong id="statPaid">0</strong></div><div class="stat"><small>Active</small><strong id="statActive">0</strong></div></div><div class="panel"><h3>Recent orders</h3><div id="recentOrders"></div></div></section>
<section id="plans"><div class="panel admin-card"><h3>Plan management</h3><div class="form-grid"><label>Plan ID<input id="pId" placeholder="1month"></label><label>Name<input id="pName" placeholder="1 Month"></label><label>Price<input id="pPrice" type="number" placeholder="99"></label><label>Duration days<input id="pDays" type="number" placeholder="30"></label><label>Description<input id="pDesc" placeholder="30 days access"></label><label>Sort order<input id="pSort" type="number" placeholder="1"></label></div><button id="addPlan" class="btn primary" style="margin-top:15px">Save Plan</button></div><div class="panel"><div id="plansTable"></div></div></section>
<section id="orders"><div class="panel"><div id="ordersTable"></div></div></section>
<section id="subscriptions"><div class="panel"><div id="subsTable"></div></div></section>
<section id="reviews"><div class="panel admin-card"><h3>Add review</h3><div class="form-grid"><label>Name<input id="rName"></label><label>Rating<input id="rRating" value="★★★★★"></label><label style="grid-column:1/-1">Review<input id="rText"></label></div><button id="addReview" class="btn primary" style="margin-top:15px">Add</button></div><div class="panel"><div id="reviewsTable"></div></div></section>
<section id="faqAdmin"><div class="panel admin-card"><h3>Add FAQ</h3><div class="form-grid"><label style="grid-column:1/-1">Question<input id="fQuestion"></label><label style="grid-column:1/-1">Answer<input id="fAnswer"></label></div><button id="addFaq" class="btn primary" style="margin-top:15px">Add</button></div><div class="panel"><div id="faqTable"></div></div></section>
<section id="settings"><div class="panel admin-card"><h3>Telegram settings</h3><p class="muted">Keep the private channel invite link here.</p><label>Private Telegram invite link<input id="tgLink"></label><label>Support Telegram<input id="tgSupport"></label><label>Support email<input id="tgEmail"></label><button id="saveSettings" class="btn primary" style="margin-top:15px">Save settings</button><p id="settingsMsg" class="muted"></p></div></section>
</div></main></div>
<div id="editorModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="editorTitle">Edit</h2><button id="editorClose" class="modal-close">×</button></div><div id="editorBody"></div><div class="modal-actions"><button id="editorCancel" class="btn">Cancel</button><button id="editorSave" class="btn primary">Save Changes</button></div></div></div>
<script src="admin.js"></script></body></html>
