<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qikly Profile Admin</title><link rel="stylesheet" href="/style.css"></head><body class="profile-admin"><div id="login" class="admin-login"><div class="admin-mark">Q</div><small>QIKLY PROFILE</small><h1>Admin Panel</h1><p>अपनी profile-rating website manage करें।</p><form id="loginForm"><input id="password" type="password" placeholder="Admin password" required><button>Login</button><div id="loginError"></div></form></div><div id="app" class="admin-shell hidden"><aside><div class="admin-brand">Qikly<span>Profile</span></div><button class="nav active" data-sec="dashboard">📊 Dashboard</button><button class="nav" data-sec="plans">💳 Report Plans</button><button class="nav" data-sec="reports">📸 Reports</button><button class="nav" data-sec="reviews">⭐ Reviews</button><button class="nav" data-sec="faq">❓ FAQ</button><button class="nav" data-sec="settings">⚙️ Settings</button><button id="logout" class="nav">↪ Logout</button></aside><main><header><div><small>CONTROL CENTER</small><h1 id="title">Dashboard</h1></div><span class="live-pill">● LIVE</span></header><section id="dashboard" class="sec active"><div class="stats"><div><small>Total Reports</small><b id="sReports">0</b></div><div><small>Paid Reports</small><b id="sPaid">0</b></div><div><small>Today</small><b id="sToday">0</b></div><div><small>Revenue</small><b id="sRevenue">₹0</b></div></div><div class="panel"><h2>Recent reports</h2><div id="recent"></div></div></section><section id="plans" class="sec"><div class="panel"><div class="panel-head"><div><small>MONETIZATION</small><h2>Report Plans</h2></div></div><form id="planForm" class="form"><input id="pId" placeholder="Plan ID e.g. deep" required><input id="pName" placeholder="Plan name" required><input id="pPrice" type="number" min="1" placeholder="Price ₹" required><input id="pSort" type="number" placeholder="Sort order"><input id="pDesc" class="wide" placeholder="Description"><label class="check"><input id="pActive" type="checkbox" checked> Show plan</label><label class="check"><input id="pFeatured" type="checkbox"> Featured</label><button class="primary">Save plan</button></form><div id="planTable"></div></div></section><section id="reports" class="sec"><div class="panel"><div class="panel-head"><div><small>ORDERS</small><h2>Profile Reports</h2></div></div><div id="reportTable"></div></div></section><section id="reviews" class="sec"><div class="panel"><h2>Reviews</h2><form id="reviewForm" class="form"><input id="rName" placeholder="Name"><input id="rRating" value="★★★★★"><textarea id="rText" class="wide" placeholder="Review"></textarea><button class="primary">Add review</button></form><div id="reviewTable"></div></div></section><section id="faq" class="sec"><div class="panel"><h2>FAQ</h2><form id="faqForm" class="form"><input id="fQuestion" class="wide" placeholder="Question"><textarea id="fAnswer" class="wide" placeholder="Answer"></textarea><button class="primary">Add FAQ</button></form><div id="faqTable"></div></div></section><section id="settings" class="sec"><div class="panel"><h2>Website Settings</h2><form id="settingsForm" class="form"><input id="marquee" class="wide" placeholder="Marquee text"><input id="support" placeholder="Support Telegram"><input id="email" placeholder="Support email"><button class="primary">Save settings</button><span id="saveMsg"></span></form></div></section></main></div><script src="/admin.js"></script></body></html>
