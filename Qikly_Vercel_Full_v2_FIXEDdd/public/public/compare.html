<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare — Qikly</title><link rel="stylesheet" href="/style.css"></head><body><div data-shell-header></div><main class="page-wrap"><div class="container"><span class="eyebrow">SIDE BY SIDE</span><h1 class="page-title">Compare products</h1><p class="page-sub">Compare price, ratings, stock and key highlights before buying.</p><div class="panel-card compare-table" id="compareRoot"></div></div></main><div data-shell-footer></div><div class="toast" id="toast"></div><script src="/store.js"></script><script>const S=QiklyStore;S.loadPublic().then(d=>{const ps=S.read(S.KEYS.compare,[]).map(id=>d.products.find(p=>p.id===id)).filter(Boolean);if(!ps.length){document.querySelector('#compareRoot').innerHTML='<div class="empty-state"><h3>Nothing to compare</h3><p>Add up to four products using the compare icon.</p><a class="btn btn-gold" href="/#shop">Shop products</a></div>';return}document.querySelector('#compareRoot').innerHTML=`<table><tr><th>Product</th>${ps.map(p=>`<th>${S.esc(p.title)}</th>`).join('')}</tr><tr><td>Image</td>${ps.map(p=>`<td><img src="${S.esc(p.images?.[0]||'')}" style="width:130px;height:140px;object-fit:cover;border-radius:10px"></td>`).join('')}</tr><tr><td>Price</td>${ps.map(p=>`<td><b>${S.money(p.price)}</b><br><del>${S.money(p.mrp)}</del></td>`).join('')}</tr><tr><td>Rating</td>${ps.map(p=>`<td>★ ${Number(p.rating||0).toFixed(1)}</td>`).join('')}</tr><tr><td>Stock</td>${ps.map(p=>`<td>${Number(p.stock)>0?'In stock':'Out of stock'}</td>`).join('')}</tr><tr><td>Highlights</td>${ps.map(p=>`<td style="text-align:left">${(p.highlights||[]).map(h=>`✓ ${S.esc(h)}`).join('<br>')}</td>`).join('')}</tr><tr><td>Buy</td>${ps.map(p=>`<td><button class="btn btn-gold" data-buy="${p.id}">Buy now</button></td>`).join('')}</tr></table>`}).catch(e=>S.toast(e.message));</script></body></html>
