<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Qikly</title><link rel="stylesheet" href="/style.css"></head><body><div data-shell-header></div><main class="page-wrap"><div class="container"><div class="checkout-steps"><span class="step active">1. Address</span><span class="step">2. Payment</span><span class="step">3. Confirmation</span></div><span class="eyebrow">SECURE CHECKOUT</span><h1 class="page-title">Delivery address</h1><p class="page-sub">Choose a saved address or add a new one. Online payment uses the existing Razorpay configuration.</p><div class="checkout-layout"><section><div class="panel-card" id="addressPanel"><div class="section-head" style="margin-bottom:12px"><h3>Saved addresses</h3><button class="btn btn-soft" id="newAddress">+ Add address</button></div><div class="two-col" style="margin-bottom:14px"><label style="font-size:12px;font-weight:800">Email for order updates<input id="aEmail" type="email" placeholder="you@example.com" required></label><div></div></div><div id="savedAddresses"></div><div id="addressFormWrap" class="hidden"><form id="addressForm" class="address-form"><div class="two-col"><label>Full name<input id="aName" required></label><label>Phone<input id="aPhone" required></label></div><div class="two-col"><label>Address<input id="aLine1" required></label><label>Apartment / Area<input id="aLine2"></label></div><div class="two-col"><label>City<input id="aCity" required></label><label>State<input id="aState" required></label></div><div class="two-col"><label>PIN code<input id="aPin" required inputmode="numeric"></label><label>Landmark<input id="aLandmark"></label></div><label>Save as<select id="aLabel"><option>Home</option><option>Work</option><option>Other</option></select></label><label class="check"><input id="aDefault" type="checkbox" checked> Make this my default address</label><button class="btn btn-dark" type="submit">Save address</button></form></div></div><div class="panel-card" style="margin-top:14px"><h3>Payment method</h3><div class="pay-options"><label class="pay-option" id="onlinePayOpt"><input type="radio" name="payment" value="online" checked><span><b>Online payment</b><small>UPI, cards and netbanking through Razorpay</small></span></label><label class="pay-option" id="codPayOpt"><input type="radio" name="payment" value="cod"><span><b>Cash on Delivery</b><small>Pay when your order arrives</small></span></label></div><div class="alert" id="paymentInfo" style="margin-top:12px"></div></div><div class="panel-card" style="margin-top:14px"><h3>Coupon</h3><div style="display:flex;gap:8px"><input id="coupon" style="flex:1;border:1px solid var(--line);border-radius:11px;padding:12px" placeholder="Enter coupon code"><button class="btn btn-soft" id="applyCoupon" type="button">Apply</button></div><p class="muted" id="couponMsg"></p></div></section><aside class="panel-card summary-card"><h3>Order summary</h3><div id="summaryItems"></div><div class="summary-row"><span>Subtotal</span><strong id="subtotal">₹0</strong></div><div class="summary-row"><span>Discount</span><strong id="discount">₹0</strong></div><div class="summary-row"><span>Shipping</span><strong id="shipping">₹0</strong></div><div class="summary-row summary-total"><span>Payable</span><strong id="payable">₹0</strong></div><button class="btn btn-gold full" id="placeOrder">Place order</button><p class="form-error" id="checkoutError" style="color:#b32644;margin-top:10px"></p></aside></div></div></main><div data-shell-footer></div><div class="toast" id="toast"></div><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="/store.js"></script><script src="/checkout.js"></script></body></html>
