<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — Qikly</title><link rel="stylesheet" href="/style.css"></head><body><div data-shell-header></div><main class="page-wrap"><div class="container"><div id="authPanel" class="panel-card"><div class="section-head"><div><span class="eyebrow">QIKLY ACCOUNT</span><h1 class="page-title">Sign in to your account</h1><p class="page-sub">Track orders, save addresses and get a faster checkout.</p></div></div><div class="two-col"><form id="loginForm" class="account-form"><h3>Login</h3><label>Email<input id="loginEmail" type="email" required></label><label>Password<input id="loginPassword" type="password" required></label><button class="btn btn-gold" type="submit">Login</button><p class="form-error" id="loginError"></p></form><form id="signupForm" class="account-form"><h3>Create account</h3><label>Name<input id="signupName" required></label><label>Email<input id="signupEmail" type="email" required></label><label>Password<input id="signupPassword" type="password" minlength="6" required></label><button class="btn btn-dark" type="submit">Create account</button><p class="form-error" id="signupError"></p></form></div></div><div id="accountPanel" class="hidden"><div class="section-head"><div><span class="eyebrow">MY QIKLY</span><h1 class="page-title" id="welcome">Account</h1><p class="page-sub" id="emailText"></p></div><button class="btn btn-soft" id="logout">Logout</button></div><div class="profile-stat"><div><b id="ordersCount">0</b><span>Orders</span></div><div><b id="wishCount">0</b><span>Wishlist items</span></div><div><b id="addressCount">0</b><span>Saved addresses</span></div></div><div class="account-tabs" style="margin-top:22px"><button class="active" data-pane="orders">Orders</button><button data-pane="profile">Profile</button><button data-pane="addresses">Addresses</button><button data-pane="ai">Qikly AI</button></div><section id="pane-orders" class="panel-card"></section><section id="pane-profile" class="panel-card hidden"><form id="profileForm" class="account-form"><div class="two-col"><label>Name<input id="profileName" required></label><label>Phone<input id="profilePhone"></label></div><button class="btn btn-dark">Save profile</button><p class="form-error" id="profileError"></p></form></section><section id="pane-addresses" class="panel-card hidden"><div class="section-head"><h3>Saved addresses</h3><button class="btn btn-soft" id="addAddr">+ Add</button></div><div id="addressList" class="address-list"></div><form id="addrForm" class="address-form hidden"><div class="two-col"><label>Label<select id="alabel"><option>Home</option><option>Work</option><option>Other</option></select></label><label>Name<input id="aname" required></label></div><div class="two-col"><label>Phone<input id="aphone" required></label><label>PIN<input id="apin" required></label></div><label>Address<input id="aline1" required></label><label>Area / Apartment<input id="aline2"></label><div class="two-col"><label>City<input id="acity" required></label><label>State<input id="astate" required></label></div><label>Landmark<input id="alandmark"></label><label class="check"><input id="adefault" type="checkbox"> Make default</label><button class="btn btn-dark">Save address</button></form></section><section id="pane-ai" class="ai-box hidden"><span class="eyebrow light">QIKLY AI</span><h2>Shopping assistant</h2><p>Ask for products by budget, use case or category.</p><div class="ai-messages" id="aiMessages"></div><form id="aiForm"><input id="aiInput" placeholder="e.g. gift under ₹2000"><button>Send</button></form></section></div></div></main><div data-shell-footer></div><div class="toast" id="toast"></div><script src="/store.js"></script><script src="/account.js"></script></body></html>
