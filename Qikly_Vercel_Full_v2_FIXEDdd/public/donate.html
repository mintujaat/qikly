<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donate — Qikly</title><link rel="stylesheet" href="style.css"><style>
.donate-wrap{max-width:980px;margin:0 auto;padding:90px 20px 60px}.donate-card{display:grid;grid-template-columns:1fr .8fr;gap:24px}.donate-panel{border:1px solid var(--line);background:#0d0d11;border-radius:20px;padding:28px}.amount-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.donate-panel input{width:100%;box-sizing:border-box}.donor-list{margin-top:18px}.donor{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line)}.donor strong{color:#fff}.donor span{color:#aaa}.back{display:inline-block;margin-bottom:22px;color:#aaa}.success-note{margin-top:15px;color:var(--good)}@media(max-width:760px){.donate-card{grid-template-columns:1fr}.amount-row{grid-template-columns:1fr}}
</style></head><body><header class="header"><a href="/" class="logo">Qikly<span>.</span></a><nav><a href="/">Home</a><a href="/#plans">Plans</a></nav><a class="header-cta" href="/">Get Access</a></header><main class="donate-wrap"><a class="back" href="/">← Back to Qikly</a><div class="eyebrow"><span></span> SUPPORT QIKLY</div><h1>Support the project.</h1><p class="muted">Choose any amount you want to contribute. Payments are processed securely through Razorpay.</p><div class="donate-card"><section class="donate-panel"><h2>Make a donation.</h2><form id="donateForm"><label>Your Name<input id="donorName" maxlength="100" required placeholder="Your name"></label><label>Amount (₹)<input id="donorAmount" type="number" min="1" max="1000000" step="1" required placeholder="Enter any amount"></label><button id="donateBtn" class="btn primary large full" type="submit">Donate Now →</button><div id="donateError" class="error"></div><div id="donateSuccess" class="success-note"></div></form></section><aside class="donate-panel"><div class="eyebrow"><span></span> TOP DONATERS</div><h2>Thank you.</h2><div id="donorList" class="donor-list"><p class="muted">Loading...</p></div></aside></div></main><div class="floating-actions"><a class="float-btn donate-float" href="/donate.html">Donate</a><a id="supportFloat" class="float-btn support-float hidden" href="#" target="_blank" rel="noopener">Support</a></div><div id="toast" class="toast"></div><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="donate.js"></script></body></html>
