<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login / Sign up — Qikly</title><link rel="stylesheet" href="/style.css"><script src="/theme.js"></script></head><body class="auth-page"><div class="auth-shell"><div class="auth-top"><a href="/" class="brand"><span class="brand-dot">Q</span><span>Qikly</span></a><button class="btn theme-toggle" data-theme-toggle>☾</button></div><div class="auth-card card"><div class="tabs"><button class="tab active" data-mode="login">Login</button><button class="tab" data-mode="signup">Create account</button></div><div class="auth-copy"><span class="eyebrow">DIWALI SHOPPING</span><h1 id="authTitle">Welcome back</h1><p id="authSub">Login to shop the sale, manage your wallet and view your orders.</p></div><div id="referralNotice" class="notice hidden">Referral code detected — it will be linked to your new account.</div><form id="authForm"><div id="nameWrap" class="hidden"><label>Full name<input id="name" maxlength="100" placeholder="Your name"></label></div><label>Email<input id="email" type="email" maxlength="180" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters"></label><div id="referralWrap" class="hidden"><label>Referral code <span class="muted">(optional)</span><input id="referralInput" maxlength="40" placeholder="e.g. QIKLYA1B2C3"></label></div><button id="submitBtn" class="btn primary full large">Login →</button><div id="authError" class="error"></div></form><p class="muted" style="font-size:11px;margin-top:15px">Your existing Qikly account and payment configuration are preserved.</p></div></div><script src="/auth.js"></script></body></html>
