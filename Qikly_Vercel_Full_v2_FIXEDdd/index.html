<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb" id="themeColorMeta">
  <meta name="description" content="Manage social media services, orders, wallet payments and support in one clear workspace.">
  <title>Mintu SMM — Growth Workspace</title>
  <script>
    (function(){
      try {
        var t = localStorage.getItem("mintu_theme");
        if (!t) t = "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mintu SMM">
  <link rel="stylesheet" href="/customer.css?v=3">
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script src="/app.js?v=3" defer></script>
</head>
<body>
  <div id="appRoot">
    <div class="boot-screen"><span class="brand-mark">M</span><span class="boot-spinner"></span><p>Opening your workspace…</p></div>
  </div>
  <div id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
